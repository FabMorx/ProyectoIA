[project]
name = "proyectointegradoria"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fabmor", email = "88408153+compudexx@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0",
    "kokoro>=0.9.4",
    "peft>=0.14.0",
    "pillow>=12.3.0",
    "reportlab>=4.2.0",
    "scipy>=1.15.3",
    "soundfile>=0.14.0",
    "streamlit>=1.65.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.20.2",
]

[project.scripts]
proyectointegradoria = "proyectointegradoria:main"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
