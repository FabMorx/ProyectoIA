version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fabmor", email = "88408153+compudexx@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0",
    "kokoro>=0.9.4",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
    "soundfile>=0.14.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
